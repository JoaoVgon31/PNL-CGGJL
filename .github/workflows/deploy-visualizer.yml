name: Deploy Visualizer

on:
  push:
    branches: [main]
    paths:
      - "project1/data/**"
      - "project1/src/*/output/**"
      - "project1/visualizer/**"
      - "project1/tools/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gerar dados do visualizador
        run: python3 project1/tools/export_graph_data.py
      - name: Verifica que o manifesto não está vazio
        run: |
          python3 -c "import json,sys; m=json.load(open('project1/visualizer/data/manifest.json')); sys.exit(0 if m['cases'] else 1)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: project1/visualizer

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
